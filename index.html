<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Realistic Soccer Game</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Malgun Gothic', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 10px;
      pointer-events: none;
      line-height: 1.6;
      z-index: 10;
    }
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 30px;
      border-radius: 30px;
      border: 2px solid #555;
      pointer-events: none;
      z-index: 10;
    }
    .score-team { display: inline-block; width: 80px; text-align: center; }
    #home-name { color: #ff3d00; } 
    #away-name { color: #2979ff; } 
    #score-text { font-size: 28px; color: #ffeb3b; margin: 0 10px; }

    #power-bar-container {
      margin-top: 10px;
      width: 200px;
      height: 15px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
    }
    #goal-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      font-family: 'Arial Black', sans-serif;
      font-size: 72px;
      font-weight: bold;
      text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000;
      display: none;
      pointer-events: none;
      z-index: 20;
      animation: pop 0.4s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.05); }
    }
    .highlight { color: #ffeb3b; font-weight: bold; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

  <div id="ui-container">
    🎮 <b>직관적 조작 업데이트</b><br>
    • 이동: <span class="highlight">화살표 키 (↑, ↓, ←, →)</span><br>
    &nbsp;&nbsp; (↑ 누르면 무조건 화면 위, ↓ 누르면 무조건 화면 아래)<br>
    • 슛: 공을 잡고 스페이스바 <span class="highlight">길게 누르기</span>
    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>
  </div>
  
  <div id="scoreboard">
    <span class="score-team" id="home-name">HOME</span>
    <span id="score-text"><span id="score-home">0</span> : <span id="score-away">0</span></span>
    <span class="score-team" id="away-name">AWAY</span>
  </div>
  
  <div id="goal-overlay">GOAL!!!</div>
  
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    const { Engine, Scene, FreeCamera, Vector3, HemisphericLight, MeshBuilder, StandardMaterial, Color3, DynamicTexture } = BABYLON;

    // ==========================================
    // 1. Player 클래스 (리얼 유니폼 & 화면 기준 이동)
    // ==========================================
    class Player {
      constructor(scene) {
        this.scene = scene;
        this.speed = 0.24;
        this.inputMap = {};
        this.hasBall = false;
        this.moveDirection = new Vector3(0, 0, 1); 
        
        this.createDetailedHumanoid();
        this.setupInput();
      }

      createDetailedHumanoid() {
        // 루트 노드
        this.mesh = MeshBuilder.CreateBox("playerRoot", { size: 0.1 }, this.scene);
        this.mesh.isVisible = false;

        // 재질(Material) 정의
        const skinMat = new StandardMaterial("skinMat", this.scene);
        skinMat.diffuseColor = new Color3(0.95, 0.75, 0.65); // 살구색 피부
        
        const jerseyMat = new StandardMaterial("jerseyMat", this.scene);
        jerseyMat.diffuseColor = new Color3(0.9, 0.1, 0.1); // 빨간 상의 유니폼

        const pantsMat = new StandardMaterial("pantsMat", this.scene);
        pantsMat.diffuseColor = new Color3(1, 1, 1); // 흰색 축구 바지

        const socksMat = new StandardMaterial("socksMat", this.scene);
        socksMat.diffuseColor = new Color3(0.1, 0.1, 0.1); // 검은 양말/축구화

        // 1. 몸통 (상의 유니폼)
        this.torso = MeshBuilder.CreateBox("torso", { width: 0.8, height: 1.1, depth: 0.45 }, this.scene);
        this.torso.position.y = 1.35;
        this.torso.material = jerseyMat;
        this.torso.parent = this.mesh;

        // 등번호 10번 구현 (DynamicTexture를 이용해 유니폼 뒤에 10 표시)
        const numberPlate = MeshBuilder.CreatePlane("numPlate", { width: 0.5, height: 0.6 }, this.scene);
        numberPlate.position.set(0, 1.35, -0.23); // 등 뒤에 밀착
        numberPlate.rotation.y = Math.PI; // 뒤를 보게 회전
        const tex = new DynamicTexture("dynamicTex", {width:256, height:256}, this.scene);
        tex.hasAlpha = true;
        const ctx = tex.getContext();
        ctx.fillStyle = "transparent";
        ctx.font = "bold 160px Arial";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("10", 128, 128);
        tex.update();
        const numMat = new StandardMaterial("numMat", this.scene);
        numMat.diffuseTexture = tex;
        numberPlate.material = numMat;
        numberPlate.parent = this.mesh;

        // 2. 하의 (바지)
        this.pants = MeshBuilder.CreateBox("pants", { width: 0.82, height: 0.4, depth: 0.47 }, this.scene);
        this.pants.position.y = 0.8;
        this.pants.material = pantsMat;
        this.pants.parent = this.mesh;

        // 3. 머리
        this.head = MeshBuilder.CreateSphere("head", { diameter: 0.52 }, this.scene);
        this.head.position.y = 2.15;
        this.head.material = skinMat;
        this.head.parent = this.mesh;

        // 4. 다리 (바지 밑단 + 다리 + 축구화 디테일 분할 조립)
        this.leftLeg = MeshBuilder.CreateCylinder("leftLeg", { height: 0.7, diameter: 0.22 }, this.scene);
        this.leftLeg.position.set(-0.24, 0.35, 0);
        this.leftLeg.material = socksMat;
        this.leftLeg.parent = this.mesh;

        this.rightLeg = this.leftLeg.clone("rightLeg");
        this.rightLeg.position.x = 0.24;
        this.rightLeg.parent = this.mesh;

        // 5. 팔 (반팔 소매 효과)
        this.leftArm = MeshBuilder.CreateCylinder("leftArm", { height: 0.8, diameter: 0.18 }, this.scene);
        this.leftArm.position.set(-0.52, 1.35, 0);
        this.leftArm.material = skinMat;
        this.leftArm.parent = this.mesh;

        this.rightArm = this.leftArm.clone("rightArm");
        this.rightArm.position.x = 0.52;
        this.rightArm.parent = this.mesh;

        this.resetPosition();
      }

      resetPosition() {
        this.mesh.position.set(-15, 0, 0); // 우리 진영 시작
        this.moveDirection.set(0, 0, 1); // 화면 오른쪽(상대 골대 방향) 조준
        this.mesh.rotation.y = Math.PI / 2;
      }

      setupInput() {
        this.scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN:
              this.inputMap[kbInfo.event.key] = true;
              break;
            case BABYLON.KeyboardEventTypes.KEYUP:
              this.inputMap[kbInfo.event.key] = false;
              break;
          }
        });
      }

      update() {
        let moveX = 0; // 경기장의 X축 (사이드라인 상하)
        let moveZ = 0; // 경기장의 Z축 (골대 좌우)

        // [수정] 화면(카메라 렌더링 뷰) 기준 직관적 화살표 이동 설계
        // 중계 카메라가 우측 터치라인 바깥(+X)에서 경기장 내부(-X)를 바라보고 있으므로:
        // ↑ 키 = 화면의 위쪽으로 이동해야 함 = 실제 경기장에서는 -X 방향 (골대 기준 하프라인 중심선)
        // ↓ 키 = 화면의 아래쪽으로 이동해야 함 = 실제 경기장에서는 +X 방향
        // ← 키 = 화면의 왼쪽으로 이동해야 함 = 실제 경기장에서는 -Z 방향 (우리팀 골대)
        // → 키 = 화면의 오른쪽으로 이동해야 함 = 실제 경기장에서는 +Z 방향 (상대팀 골대)
        if (this.inputMap["ArrowUp"])    moveX -= 1;
        if (this.inputMap["ArrowDown"])  moveX += 1;
        if (this.inputMap["ArrowLeft"])  moveZ -= 1;
        if (this.inputMap["ArrowRight"]) moveZ += 1;

        if (moveX !== 0 || moveZ !== 0) {
          const inputDir = new Vector3(moveX, 0, moveZ).normalize();
          this.mesh.position.addInPlace(inputDir.scale(this.speed));
          this.moveDirection.copyFrom(inputDir);

          // 이동 방향으로 정밀 회전 연산
          const angle = Math.atan2(inputDir.x, inputDir.z);
          this.mesh.rotation.y = angle;

          // 역동적인 뛰기 애니메이션 
          const time = performance.now() * 0.016;
          this.leftLeg.rotation.x = Math.sin(time) * 0.5;
          this.rightLeg.rotation.x = -Math.sin(time) * 0.5;
          this.leftArm.rotation.x = -Math.sin(time) * 0.3;
          this.rightArm.rotation.x = Math.sin(time) * 0.3;
        } else {
          this.leftLeg.rotation.x = 0;
          this.rightLeg.rotation.x = 0;
          this.leftArm.rotation.x = 0;
          this.rightArm.rotation.x = 0;
        }

        // 경기장 아웃 제한 설정
        this.mesh.position.x = Math.max(-34, Math.min(34, this.mesh.position.x));
        this.mesh.position.z = Math.max(-49, Math.min(49, this.mesh.position.z));
      }
    }

    // ==========================================
    // 2. Game 클래스 (격자 잔디 텍스처 자체 생성)
    // ==========================================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.engine = new Engine(this.canvas, true);
        this.scene = new Scene(this.engine);
        
        this.fieldWidth = 70;
        this.fieldHeight = 100;
        this.ballVelocity = new Vector3(0, 0, 0);
        this.friction = 0.965;
        this.isResetting = false;

        this.scoreHome = 0; 
        this.scoreAway = 0; 

        this.shootPowerMax = 1.9;
        this.shootPowerCurrent = 0.4;
        this.isChargingShoot = false;

        this.initScene();
        this.createProceduralGrassField(); // 격자 잔디 생성 추가
        this.createRealGoals();
        this.createBall();
        this.player = new Player(this.scene);
      }

      initScene() {
        this.camera = new FreeCamera("sideCamera", new Vector3(65, 26, 0), this.scene);
        this.camera.setTarget(new Vector3(0, -5, 0)); 
        
        this.light = new HemisphericLight("light", new Vector3(0, 1, 0), this.scene);
        this.light.intensity = 1.0;
      }

      createProceduralGrassField() {
        // [추가] 캔버스를 이용해 잔디 구장의 스트라이프(격자 줄무늬) 텍스처를 동적으로 그립니다.
        const grassTexture = new DynamicTexture("grassTex", {width: 512, height: 1024}, this.scene);
        const ctx = grassTexture.getContext();

        // 16개의 잔디 줄무늬 구역 그리기
        const stripes = 16;
        const stripeHeight = 1024 / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = (i % 2 === 0) ? "#2e7d32" : "#388e3c"; // 짙은 녹색과 밝은 녹색 교차
          ctx.fillRect(0, i * stripeHeight, 512, stripeHeight);
        }
        
        // 흰색 경기장 선 외곽 테두리선 추가 스케치
        ctx.strokeStyle = "rgba(255,255,255,0.6)";
        ctx.lineWidth = 12;
        ctx.strokeRect(15, 15, 512 - 30, 1024 - 30);
        
        // 센터서클 라인 추가
        ctx.beginPath();
        ctx.arc(256, 512, 100, 0, 2 * Math.PI);
        ctx.stroke();

        grassTexture.update();

        const field = MeshBuilder.CreateGround("soccerField", { width: this.fieldWidth, height: this.fieldHeight }, this.scene);
        const fieldMat = new StandardMaterial("fieldMat", this.scene);
        fieldMat.diffuseTexture = grassTexture;
        fieldMat.specularColor = new Color3(0, 0, 0); // 빛 반사 억제하여 잔디 느낌 강화
        field.material = fieldMat;
      }

      createRealGoals() {
        this.goalW = 14; this.goalH = 5; this.goalD = 4;
        this.createNetStructure(0, 50, this.goalW, this.goalH, this.goalD, true);  // AWAY 골대 (우측)
        this.createNetStructure(0, -50, this.goalW, this.goalH, this.goalD, false); // HOME 골대 (좌측)
      }

      createNetStructure(x, z, w, h, d, isAwayGoal) {
        const whiteMat = new StandardMaterial("whiteMat", this.scene);
        whiteMat.diffuseColor = new Color3(0.95, 0.95, 0.95);

        const netMat = new StandardMaterial("netMat", this.scene);
        netMat.diffuseColor = new Color3(0.9, 0.9, 0.9);
        netMat.alpha = 0.2;

        const zDir = isAwayGoal ? 1 : -1;

        const leftPost = MeshBuilder.CreateCylinder("postL", { height: h, diameter: 0.25 }, this.scene);
        leftPost.position.set(x - w/2, h/2, z); leftPost.material = whiteMat;
        const rightPost = MeshBuilder.CreateCylinder("postR", { height: h, diameter: 0.25 }, this.scene);
        rightPost.position.set(x + w/2, h/2, z); rightPost.material = whiteMat;
        const topBar = MeshBuilder.CreateCylinder("barT", { height: w, diameter: 0.25 }, this.scene);
        topBar.position.set(x, h, z); topBar.rotation.z = Math.PI / 2; topBar.material = whiteMat;

        const backNet = MeshBuilder.CreateBox("backNet", { width: w, height: h, depth: 0.1 }, this.scene);
        backNet.position.set(x, h/2, z + (d * zDir)); backNet.material = netMat;
        const topNet = MeshBuilder.CreateBox("topNet", { width: w, height: 0.1, depth: d }, this.scene);
        topNet.position.set(x, h, z + (d/2 * zDir)); topNet.material = netMat;
        const sideNetL = MeshBuilder.CreateBox("sideNetL", { width: 0.1, height: h, depth: d }, this.scene);
        sideNetL.position.set(x - w/2, h/2, z + (d/2 * zDir)); sideNetL.material = netMat;
        const sideNetR = MeshBuilder.CreateBox("sideNetR", { width: 0.1, height: h, depth: d }, this.scene);
        sideNetR.position.set(x + w/2, h/2, z + (d/2 * zDir)); sideNetR.material = netMat;
      }

      createBall() {
        this.ballRadius = 0.55;
        this.ball = MeshBuilder.CreateSphere("soccerBall", { diameter: this.ballRadius * 2 }, this.scene);
        this.resetBall();

        const ballMat = new StandardMaterial("ballMat", this.scene);
        ballMat.diffuseColor = new Color3(1, 1, 1);
        this.ball.material = ballMat;
      }

      resetBall() {
        this.ball.position.set(0, this.ballRadius, 0);
        this.ballVelocity.set(0, 0, 0);
      }

      triggerGoal(isAwayGoal) {
        if (this.isResetting) return;
        this.isResetting = true;
        this.player.hasBall = false;

        if (isAwayGoal) {
          this.scoreHome++;
          document.getElementById("score-home").innerText = this.scoreHome;
        } else {
          this.scoreAway++;
          document.getElementById("score-away").innerText = this.scoreAway;
        }

        const overlay = document.getElementById("goal-overlay");
        overlay.style.display = "block";

        setTimeout(() => {
          this.resetBall();
          this.player.resetPosition();
          overlay.style.display = "none";
          this.isResetting = false;
        }, 2000);
      }

      processBallPhysics() {
        if (this.isResetting) return;

        if (this.player.hasBall) {
          const offset = this.player.moveDirection.scale(1.35);
          this.ball.position.x = this.player.mesh.position.x + offset.x;
          this.ball.position.z = this.player.mesh.position.z + offset.z;
          this.ball.position.y = this.ballRadius; 
          this.ballVelocity.set(0, 0, 0);
        } else {
          this.ball.position.addInPlace(this.ballVelocity);
          this.ballVelocity.scaleInPlace(this.friction);

          if (this.ballVelocity.length() < 0.001) this.ballVelocity.set(0, 0, 0);

          // 정밀한 골라인 통과 연산 판정 (골대 안 통과)
          if (Math.abs(this.ball.position.z) >= 49.3) {
            if (this.ball.position.x >= -this.goalW/2 && this.ball.position.x <= this.goalW/2) {
              const isAwayGoal = this.ball.position.z > 0;
              this.triggerGoal(isAwayGoal);
              return;
            }
          }

          const borderX = (this.fieldWidth / 2) - this.ballRadius;
          const borderZ = (this.fieldHeight / 2) - this.ballRadius;

          if (Math.abs(this.ball.position.x) > borderX) {
            this.ball.position.x = Math.sign(this.ball.position.x) * borderX;
            this.ballVelocity.x *= -0.5;
          }
          if (Math.abs(this.ball.position.z) > borderZ) {
            if (this.ball.position.x < -this.goalW/2 || this.ball.position.x > this.goalW/2) {
              this.ball.position.z = Math.sign(this.ball.position.z) * borderZ;
              this.ballVelocity.z *= -0.5;
            }
          }

          if (this.ball.position.y !== this.ballRadius) this.ball.position.y = this.ballRadius;
        }
      }

      checkCollisionsAndActions() {
        if (this.isResetting) return;

        const playerPos = this.player.mesh.position;
        const ballPos = this.ball.position;
        const distance = Vector3.Distance(playerPos, ballPos);

        if (!this.player.hasBall && distance < 1.6) {
          this.player.hasBall = true;
        }

        if (this.player.hasBall) {
          if (this.player.inputMap[" "]) {
            this.isChargingShoot = true;
            document.getElementById("power-bar-container").style.display = "block";
            
            if (this.shootPowerCurrent < this.shootPowerMax) {
              this.shootPowerCurrent += 0.05;
              const percent = ((this.shootPowerCurrent - 0.4) / (this.shootPowerMax - 0.4)) * 100;
              document.getElementById("power-bar").style.width = percent + "%";
            }
          } else if (this.isChargingShoot && !this.player.inputMap[" "]) {
            this.player.hasBall = false;
            this.isChargingShoot = false;

            const shootDirection = this.player.moveDirection.normalize();
            this.ballVelocity = shootDirection.scale(this.shootPowerCurrent);

            this.shootPowerCurrent = 0.4;
            document.getElementById("power-bar-container").style.display = "none";
            document.getElementById("power-bar").style.width = "0%";
          }
        }
      }

      start() {
        this.engine.runRenderLoop(() => {
          this.player.update();
          this.checkCollisionsAndActions();
          this.processBallPhysics();
          this.scene.render();
        });

        window.addEventListener('resize', () => {
          this.engine.resize();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('renderCanvas');
      const game = new Game(canvas);
      game.start();
    });
  </script>
</body>
</html>
