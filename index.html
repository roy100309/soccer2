<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js 11v11 Giant Scale Side-View Soccer Game</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #87CEEB;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Malgun Gothic', sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 20px;
      border-radius: 10px;
      pointer-events: none;
      line-height: 1.6;
      z-index: 10;
    }
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #333;
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 30px;
      border-radius: 30px;
      border: 2px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      pointer-events: none;
      z-index: 10;
    }
    .score-team { display: inline-block; width: 80px; text-align: center; }
    #home-name { color: #d32f2f; } 
    #away-name { color: #1976d2; } 
    #score-text { font-size: 28px; color: #222; margin: 0 10px; }

    #power-bar-container {
      margin-top: 10px;
      width: 200px;
      height: 15px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
    }
    #goal-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      font-family: 'Arial Black', sans-serif;
      font-size: 72px;
      font-weight: bold;
      text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000;
      display: none;
      pointer-events: none;
      z-index: 20;
      animation: pop 0.4s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.05); }
    }
    .highlight { color: #ffeb3b; font-weight: bold; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

  <div id="ui-container">
    🎥 <b>사이드 뷰 중계 시점 & 선수 스케일 업</b><br>
    • 시점 복원: 정면을 탁 트이게 바라보는 <span class="highlight">기존 측면 추적 카메라(Side-View)</span> 복구<br>
    • 스케일 업: 경기장 크기에 맞춰 <span class="highlight">선수들의 크기를 1.5배 크게 확대</span><br>
    • 물리 충돌: 커진 덩치에 맞춰 충돌 히트박스 반경 동시 확장<br>
    • 조작: 화살표 키 (이동) / E (대시) / 스페이스바 (슛 차징)
    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>
  </div>
  
  <div id="scoreboard">
    <span class="score-team" id="home-name">HOME</span>
    <span id="score-text"><span id="score-home">0</span> : <span id="score-away">0</span></span>
    <span class="score-team" id="away-name">AWAY</span>
  </div>
  
  <div id="goal-overlay">GOAL!!!</div>
  
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    const { Engine, Scene, FreeCamera, Vector3, HemisphericLight, DirectionalLight, MeshBuilder, StandardMaterial, Color3, DynamicTexture } = BABYLON;

    // 선수들의 덩치가 커짐에 따라 충돌 물리 반경 확장 (기존 0.6 -> 1.0)
    const PLAYER_RADIUS = 1.0;
    const BALL_RADIUS = 0.55;

    // ==========================================
    // 1. Player 클래스 (1.5배 커진 리얼 3D 휴머노이드)
    // ==========================================
    class Player {
      constructor(scene) {
        this.scene = scene;
        this.minSpeed = 0.18;     
        this.maxSpeed = 0.40;     
        this.currentSpeed = 0.18; 
        this.acceleration = 0.014; 
        
        this.inputMap = {};
        this.hasBall = false;
        this.moveDirection = new Vector3(0, 0, 1);
        
        this.createDetailedHumanoid();
        this.setupInput();
      }

      createDetailedHumanoid() {
        this.mesh = MeshBuilder.CreateBox("playerRoot", { size: 0.1 }, this.scene);
        this.mesh.isVisible = false;

        const skinMat = new StandardMaterial("skinMat", this.scene);
        skinMat.diffuseColor = new Color3(0.93, 0.77, 0.67);
        
        const jerseyMat = new StandardMaterial("jerseyMat", this.scene);
        jerseyMat.diffuseColor = new Color3(0.85, 0.08, 0.08); 
        
        const pantsMat = new StandardMaterial("pantsMat", this.scene);
        pantsMat.diffuseColor = new Color3(0.1, 0.1, 0.1);
        
        const socksMat = new StandardMaterial("socksMat", this.scene);
        socksMat.diffuseColor = new Color3(0.9, 0.9, 0.9);
        
        const bootsMat = new StandardMaterial("bootsMat", this.scene);
        bootsMat.diffuseColor = new Color3(0.15, 0.65, 0.15);

        // 상체 (스케일 업 반영: 기존보다 크고 두껍게 조정)
        this.torso = MeshBuilder.CreateCylinder("torso", { diameterTop: 1.1, diameterBottom: 0.8, height: 1.6, tessellation: 12 }, this.scene);
        this.torso.position.y = 2.4; 
        this.torso.scaling.z = 0.65;
        this.torso.material = jerseyMat; 
        this.torso.parent = this.mesh;

        // 등번호
        const numberPlate = MeshBuilder.CreatePlane("numPlate", { width: 0.65, height: 0.8 }, this.scene);
        numberPlate.position.set(0, 2.5, -0.36); 
        numberPlate.rotation.y = Math.PI; 
        const tex = new DynamicTexture("dynamicTex", {width:256, height:256}, this.scene);
        tex.hasAlpha = true; const ctx = tex.getContext();
        ctx.fillStyle = "transparent"; ctx.font = "bold 150px Arial"; ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("7", 128, 128); tex.update();
        const numMat = new StandardMaterial("numMat", this.scene);
        numMat.diffuseTexture = tex; numberPlate.material = numMat; numberPlate.parent = this.mesh;

        // 목 및 머리
        const neck = MeshBuilder.CreateCylinder("neck", { diameter: 0.3, height: 0.35 }, this.scene);
        neck.position.y = 3.3; neck.material = skinMat; neck.parent = this.mesh;

        this.head = MeshBuilder.CreateSphere("head", { diameterX: 0.65, diameterY: 0.75, diameterZ: 0.68 }, this.scene);
        this.head.position.y = 3.75; this.head.material = skinMat; this.head.parent = this.mesh;

        const hair = MeshBuilder.CreateSphere("hair", { diameter: 0.68 }, this.scene);
        hair.position.set(0, 3.9, -0.06);
        const hairMat = new StandardMaterial("hairMat", this.scene); hairMat.diffuseColor = new Color3(0.15, 0.1, 0.05);
        hair.material = hairMat; hair.parent = this.mesh;

        // 하체
        this.pelvis = MeshBuilder.CreateBox("pelvis", { width: 0.9, height: 0.5, depth: 0.6 }, this.scene);
        this.pelvis.position.y = 1.55; this.pelvis.material = pantsMat; this.pelvis.parent = this.mesh;

        // 왼쪽 다리
        this.leftLegRoot = MeshBuilder.CreateBox("leftLegRoot", { size: 0.05 }, this.scene);
        this.leftLegRoot.position.set(-0.3, 1.4, 0); this.leftLegRoot.parent = this.mesh; this.leftLegRoot.isVisible = false;
        const leftThigh = MeshBuilder.CreateCylinder("leftThigh", { diameterTop: 0.4, diameterBottom: 0.32, height: 0.65 }, this.scene);
        leftThigh.position.y = -0.3; leftThigh.material = pantsMat; leftThigh.parent = this.leftLegRoot;
        const leftCalf = MeshBuilder.CreateCylinder("leftCalf", { diameterTop: 0.3, diameterBottom: 0.2, height: 0.65 }, this.scene);
        leftCalf.position.y = -0.92; leftCalf.material = socksMat; leftCalf.parent = this.leftLegRoot;
        const leftFoot = MeshBuilder.CreateBox("leftFoot", { width: 0.24, height: 0.18, depth: 0.45 }, this.scene);
        leftFoot.position.set(0, -1.3, 0.09); leftFoot.material = bootsMat; leftFoot.parent = this.leftLegRoot;

        // 오른쪽 다리
        this.rightLegRoot = MeshBuilder.CreateBox("rightLegRoot", { size: 0.05 }, this.scene);
        this.rightLegRoot.position.set(0.3, 1.4, 0); this.rightLegRoot.parent = this.mesh; this.rightLegRoot.isVisible = false;
        const rightThigh = leftThigh.clone("rightThigh"); rightThigh.parent = this.rightLegRoot;
        const rightCalf = leftCalf.clone("rightCalf"); rightCalf.parent = this.rightLegRoot;
        const rightFoot = leftFoot.clone("rightFoot"); rightFoot.parent = this.rightLegRoot;

        // 양팔
        this.leftArm = MeshBuilder.CreateCylinder("leftArm", { diameterTop: 0.25, diameterBottom: 0.2, height: 1.1 }, this.scene);
        this.leftArm.position.set(-0.72, 2.4, 0); this.leftArm.material = jerseyMat; this.leftArm.parent = this.mesh;
        this.rightArm = this.leftArm.clone("rightArm"); this.rightArm.position.x = 0.72; this.rightArm.parent = this.mesh;

        this.resetPosition();
      }

      resetPosition() {
        this.mesh.position.set(0, 0, -20); 
        this.moveDirection.set(0, 0, 1); 
        this.mesh.rotation.y = 0;
        this.currentSpeed = this.minSpeed;
      }

      setupInput() {
        this.scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN:
              this.inputMap[kbInfo.event.key.toLowerCase()] = true;
              break;
            case BABYLON.KeyboardEventTypes.KEYUP:
              this.inputMap[kbInfo.event.key.toLowerCase()] = false;
              break;
          }
        });
      }

      update(fieldWidth, fieldHeight) {
        let moveX = 0;
        let moveZ = 0;

        if (this.inputMap["arrowup"])    moveZ += 1; 
        if (this.inputMap["arrowdown"])  moveZ -= 1; 
        if (this.inputMap["arrowleft"])  moveX -= 1; 
        if (this.inputMap["arrowright"]) moveX += 1; 

        const isMoving = (moveX !== 0 || moveZ !== 0);

        if (this.inputMap["e"] && isMoving) {
          this.currentSpeed = Math.min(this.maxSpeed, this.currentSpeed + this.acceleration);
        } else {
          this.currentSpeed = Math.max(this.minSpeed, this.currentSpeed - this.acceleration * 1.5);
        }

        if (isMoving) {
          const inputDir = new Vector3(moveX, 0, moveZ).normalize();
          this.mesh.position.addInPlace(inputDir.scale(this.currentSpeed));
          this.moveDirection.copyFrom(inputDir);

          const angle = Math.atan2(inputDir.x, inputDir.z);
          this.mesh.rotation.y = angle;

          const animeSpeed = this.currentSpeed * 0.12;
          const time = performance.now() * animeSpeed;
          
          this.leftLegRoot.rotation.x = Math.sin(time) * 0.6;
          this.rightLegRoot.rotation.x = -Math.sin(time) * 0.6;
          this.leftArm.rotation.x = -Math.sin(time) * 0.4;
          this.rightArm.rotation.x = Math.sin(time) * 0.4;
          this.torso.rotation.x = 0.12;
        } else {
          this.leftLegRoot.rotation.x = 0; this.rightLegRoot.rotation.x = 0;
          this.leftArm.rotation.x = 0; this.rightArm.rotation.x = 0;
          this.torso.rotation.x = 0;
        }

        const limitX = (fieldWidth / 2) - 1.0;
        const limitZ = (fieldHeight / 2) - 1.0;
        this.mesh.position.x = Math.max(-limitX, Math.min(limitX, this.mesh.position.x));
        this.mesh.position.z = Math.max(-limitZ, Math.min(limitZ, this.mesh.position.z));
      }
    }

    // ==========================================
    // 2. DummyPlayer 클래스 (1.5배 커진 포메이션 더미)
    // ==========================================
    class DummyPlayer {
      constructor(name, team, position, scene) {
        this.name = name;
        this.team = team;
        this.initialPos = position;
        this.scene = scene;
        this.createMesh();
      }

      createMesh() {
        this.mesh = MeshBuilder.CreateBox(this.name + "Root", { size: 0.1 }, this.scene);
        this.mesh.isVisible = false;
        this.mesh.position.copyFrom(this.initialPos);

        const skinMat = new StandardMaterial("dummySkin", this.scene);
        skinMat.diffuseColor = new Color3(0.92, 0.75, 0.65);

        const jerseyMat = new StandardMaterial("dummyJersey", this.scene);
        jerseyMat.diffuseColor = (this.team === "home") ? new Color3(0.85, 0.08, 0.08) : new Color3(0.08, 0.25, 0.85);

        const pantsMat = new StandardMaterial("dummyPants", this.scene);
        pantsMat.diffuseColor = (this.team === "home") ? new Color3(0.1, 0.1, 0.1) : new Color3(0.9, 0.9, 0.9);

        // 덩치 키운 몸체 구조 조립
        const torso = MeshBuilder.CreateCylinder("dTorso", { diameterTop: 1.1, diameterBottom: 0.8, height: 1.6, tessellation: 10 }, this.scene);
        torso.position.y = 2.4; torso.scaling.z = 0.65; torso.material = jerseyMat; torso.parent = this.mesh;

        const head = MeshBuilder.CreateSphere("dHead", { diameter: 0.7 }, this.scene);
        head.position.y = 3.6; head.material = skinMat; head.parent = this.mesh;

        const pelvis = MeshBuilder.CreateBox("dPelvis", { width: 0.9, height: 0.5, depth: 0.6 }, this.scene);
        pelvis.position.y = 1.55; pelvis.material = pantsMat; pelvis.parent = this.mesh;

        const leftLeg = MeshBuilder.CreateCylinder("dLLeg", { diameter: 0.32, height: 1.3 }, this.scene);
        leftLeg.position.set(-0.3, 0.75, 0); leftLeg.material = pantsMat; leftLeg.parent = this.mesh;

        const rightLeg = leftLeg.clone("dRLeg"); rightLeg.position.x = 0.3; rightLeg.parent = this.mesh;

        this.mesh.rotation.y = (this.team === "home") ? 0 : Math.PI;
      }
    }

    // ==========================================
    // 3. Game 클래스 (사이드 뷰 복원 및 충돌 제어)
    // ==========================================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.engine = new Engine(this.canvas, true);
        this.scene = new Scene(this.engine);
        
        this.fieldWidth = 140;
        this.fieldHeight = 200;
        
        this.ballVelocity = new Vector3(0, 0, 0);
        this.friction = 0.982; 
        this.gravity = 0.042; 
        this.isResetting = false;

        this.scoreHome = 0; 
        this.scoreAway = 0; 

        this.shootPowerMax = 3.8; 
        this.shootPowerCurrent = 0.8;
        this.isChargingShoot = false;

        this.dummies = [];

        this.initScene();
        this.createProceduralGrassField();
        this.createRealGoals();
        this.createBall();
        this.player = new Player(this.scene);
        this.spawnFormationDummies();
      }

      initScene() {
        this.scene.clearColor = new Color3(0.53, 0.81, 0.92);

        // ★ [복원] 전처럼 정면 앞쪽을 비워둔 채 측면에서 트래킹하는 사이드 뷰 카메라
        this.camera = new FreeCamera("sideFollowCamera", new Vector3(90, 38, 0), this.scene);
        this.camera.setTarget(new Vector3(0, 0, 0)); 
        
        this.light = new HemisphericLight("light", new Vector3(0, 1, 0), this.scene);
        this.light.intensity = 0.8;

        const sunLight = new DirectionalLight("sunLight", new Vector3(-1, -2, -0.5), this.scene);
        sunLight.intensity = 0.9;
      }

      spawnFormationDummies() {
        // 4-2-3-1 대형 좌표 세팅
        const homePositions = [
          { pos: "GK",  coords: new Vector3(0, 0, -92) },
          { pos: "LB",  coords: new Vector3(-45, 0, -65) },
          { pos: "LCB", coords: new Vector3(-15, 0, -70) },
          { pos: "RCB", coords: new Vector3(15, 0, -70) },
          { pos: "RB",  coords: new Vector3(45, 0, -65) },
          { pos: "LDM", coords: new Vector3(-18, 0, -42) },
          { pos: "RDM", coords: new Vector3(18, 0, -42) },
          { pos: "LAM", coords: new Vector3(-40, 0, -18) },
          { pos: "CAM", coords: new Vector3(0, 0, -18) }, 
          { pos: "RAM", coords: new Vector3(40, 0, -18) }
        ];

        const awayPositions = [
          { pos: "GK",  coords: new Vector3(0, 0, 92) },
          { pos: "LB",  coords: new Vector3(45, 0, 65) }, 
          { pos: "LCB", coords: new Vector3(15, 0, 70) },
          { pos: "RCB", coords: new Vector3(-15, 0, 70) },
          { pos: "RB",  coords: new Vector3(-45, 0, 65) },
          { pos: "LDM", coords: new Vector3(18, 0, 42) },
          { pos: "RDM", coords: new Vector3(-18, 0, 42) },
          { pos: "LAM", coords: new Vector3(40, 0, 18) },
          { pos: "CAM", coords: new Vector3(0, 0, 18) },
          { pos: "RAM", coords: new Vector3(-40, 0, 18) },
          { pos: "ST",  coords: new Vector3(0, 0, 8) }   
        ];

        homePositions.forEach((p, idx) => {
          this.dummies.push(new DummyPlayer(`Home_${p.pos}_${idx}`, "home", p.coords, this.scene));
        });

        awayPositions.forEach((p, idx) => {
          this.dummies.push(new DummyPlayer(`Away_${p.pos}_${idx}`, "away", p.coords, this.scene));
        });
      }

      updateCameraFollow() {
        if (!this.player || !this.player.mesh) return;
        const playerPos = this.player.mesh.position;
        
        // 사이드 뷰 트래킹: X축(거리)과 Y축(높이)은 유지한 채 Z축(세로축)만 플레이어를 부드럽게 추적
        const targetCameraX = playerPos.x + 90; 
        const targetCameraY = 38;               
        const targetCameraZ = playerPos.z;      

        this.camera.position.x = BABYLON.Scalar.Lerp(this.camera.position.x, targetCameraX, 0.07);
        this.camera.position.z = BABYLON.Scalar.Lerp(this.camera.position.z, targetCameraZ, 0.07);
        this.camera.position.y = BABYLON.Scalar.Lerp(this.camera.position.y, targetCameraY, 0.07);

        this.camera.setTarget(new Vector3(playerPos.x, playerPos.y + 2.0, playerPos.z));
      }

      createProceduralGrassField() {
        const grassTexture = new DynamicTexture("grassTex", {width: 1024, height: 2048}, this.scene);
        const ctx = grassTexture.getContext();
        const stripes = 26; 
        const stripeHeight = 2048 / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = (i % 2 === 0) ? "#2e7d32" : "#388e3c"; 
          ctx.fillRect(0, i * stripeHeight, 1024, stripeHeight);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 14; ctx.strokeRect(20, 20, 1024 - 40, 2048 - 40);
        ctx.beginPath(); ctx.moveTo(20, 1024); ctx.lineTo(1024-20, 1024); ctx.stroke();
        ctx.beginPath(); ctx.arc(512, 1024, 160, 0, 2 * Math.PI); ctx.stroke();
        grassTexture.update();

        const field = MeshBuilder.CreateGround("soccerField", { width: this.fieldWidth, height: this.fieldHeight }, this.scene);
        const fieldMat = new StandardMaterial("fieldMat", this.scene);
        fieldMat.diffuseTexture = grassTexture;
        fieldMat.specularColor = new Color3(0.02, 0.02, 0.02);
        field.material = fieldMat;
      }

      createRealGoals() {
        this.goalW = 26; this.goalH = 8.0; this.goalD = 6.0; 
        this.createNetStructure(0, this.fieldHeight/2, this.goalW, this.goalH, this.goalD, true);  
        this.createNetStructure(0, -this.fieldHeight/2, this.goalW, this.goalH, this.goalD, false); 
      }

      createNetStructure(x, z, w, h, d, isAwayGoal) {
        const whiteMat = new StandardMaterial("whiteMat", this.scene);
        whiteMat.diffuseColor = new Color3(0.95, 0.95, 0.95);
        const netMat = new StandardMaterial("netMat", this.scene);
        netMat.diffuseColor = new Color3(0.9, 0.9, 0.9); netMat.alpha = 0.2; 
        const zDir = isAwayGoal ? 1 : -1;

        const leftPost = MeshBuilder.CreateCylinder("postL", { height: h, diameter: 0.4 }, this.scene); leftPost.position.set(x - w/2, h/2, z); leftPost.material = whiteMat;
        const rightPost = MeshBuilder.CreateCylinder("postR", { height: h, diameter: 0.4 }, this.scene); rightPost.position.set(x + w/2, h/2, z); rightPost.material = whiteMat;
        const topBar = MeshBuilder.CreateCylinder("barT", { height: w, diameter: 0.4 }, this.scene); topBar.position.set(x, h, z); topBar.rotation.z = Math.PI / 2; topBar.material = whiteMat;
        const backNet = MeshBuilder.CreateBox("backNet", { width: w, height: h, depth: 0.1 }, this.scene); backNet.position.set(x, h/2, z + (d * zDir)); backNet.material = netMat;
      }

      createBall() {
        this.ball = MeshBuilder.CreateSphere("soccerBall", { diameter: BALL_RADIUS * 2 }, this.scene);
        this.resetBall();
        const ballMat = new StandardMaterial("ballMat", this.scene);
        ballMat.diffuseColor = new Color3(1, 1, 1);
        this.ball.material = ballMat;
      }

      resetBall() {
        this.ball.position.set(0, BALL_RADIUS, 0);
        this.ballVelocity.set(0, 0, 0);
      }

      triggerGoal(isAwayGoal) {
        if (this.isResetting) return;
        this.isResetting = true;
        this.player.hasBall = false;

        if (isAwayGoal) { this.scoreHome++; document.getElementById("score-home").innerText = this.scoreHome; }
        else { this.scoreAway++; document.getElementById("score-away").innerText = this.scoreAway; }

        const overlay = document.getElementById("goal-overlay");
        overlay.style.display = "block";

        setTimeout(() => {
          this.resetBall();
          this.player.resetPosition();
          overlay.style.display = "none";
          this.isResetting = false;
        }, 2000);
      }

      handleHardPhysicsCollisions() {
        const pPos = this.player.mesh.position;

        // 커진 PLAYER_RADIUS 기틀 하에 정밀 연산 밀어내기
        this.dummies.forEach(dummy => {
          const dPos = dummy.mesh.position;
          const dist = Vector3.Distance(pPos, dPos);
          const minDist = PLAYER_RADIUS + PLAYER_RADIUS;

          if (dist < minDist) {
            const pushDirection = pPos.subtract(dPos).normalize();
            const overlap = minDist - dist;
            pPos.addInPlace(pushDirection.scale(overlap));
          }
        });

        if (!this.player.hasBall) {
          const bPos = this.ball.position;
          
          this.dummies.forEach(dummy => {
            const dPos = dummy.mesh.position;
            const distToBall = Vector3.Distance(bPos, dPos);
            const collisionDist = PLAYER_RADIUS + BALL_RADIUS;

            if (distToBall < collisionDist) {
              const reflectionNormal = bPos.subtract(dPos).normalize();
              const overlap = collisionDist - distToBall;
              
              bPos.addInPlace(reflectionNormal.scale(overlap)); 

              const speed = this.ballVelocity.length();
              this.ballVelocity.copyFrom(reflectionNormal.scale(Math.max(speed * 0.78, 0.18)));
              this.ballVelocity.y = speed * 0.22; 
            }
          });
        }
      }

      processBallPhysics() {
        if (this.isResetting) return;

        if (this.player.hasBall) {
          // 커진 몸집에 맞춰 볼의 리프팅 오프셋 간격 넓힘
          const offset = this.player.moveDirection.scale(1.9);
          this.ball.position.x = this.player.mesh.position.x + offset.x;
          this.ball.position.z = this.player.mesh.position.z + offset.z;
          this.ball.position.y = BALL_RADIUS; 
          this.ballVelocity.set(0, 0, 0);
        } else {
          this.ball.position.addInPlace(this.ballVelocity);
          
          if (this.ball.position.y > BALL_RADIUS) {
            this.ballVelocity.y -= this.gravity;
          } else {
            this.ball.position.y = BALL_RADIUS;
            this.ballVelocity.y = 0;
            this.ballVelocity.x *= this.friction;
            this.ballVelocity.z *= this.friction;
          }

          if (this.ballVelocity.length() < 0.001) this.ballVelocity.set(0, 0, 0);

          const currentZ = this.ball.position.z;
          const halfH = this.fieldHeight / 2;
          if (Math.abs(currentZ) >= halfH - 0.5) {
            if (this.ball.position.x >= -this.goalW/2 && this.ball.position.x <= this.goalW/2) {
              if (this.ball.position.y <= this.goalH + 0.3) {
                const isAwayGoal = currentZ > 0;
                this.triggerGoal(isAwayGoal);
                return;
              }
            }
          }

          const borderX = (this.fieldWidth / 2) - BALL_RADIUS;
          const borderZ = (this.fieldHeight / 2) - BALL_RADIUS;
          let isOut = false;

          if (Math.abs(this.ball.position.x) > borderX) {
            this.ball.position.x = Math.sign(this.ball.position.x) * (borderX - 1.5);
            isOut = true;
          }
          if (Math.abs(this.ball.position.z) > borderZ) {
            if (this.ball.position.x < -this.goalW/2 || this.ball.position.x > this.goalW/2) {
              this.ball.position.z = Math.sign(this.ball.position.z) * (borderZ - 1.5);
              isOut = true;
            }
          }

          if (isOut) {
            this.ballVelocity.set(0, 0, 0);
            this.ball.position.y = BALL_RADIUS;
            const centerDirection = new Vector3(0, 0, 0).subtract(this.ball.position).normalize();
            this.player.mesh.position.copyFrom(this.ball.position.add(centerDirection.scale(3.0)));
            this.player.mesh.position.y = 0;
          }
        }
      }

      checkCollisionsAndActions() {
        if (this.isResetting) return;

        const playerPos = this.player.mesh.position;
        const ballPos = this.ball.position;
        const distance = Vector3.Distance(playerPos, ballPos);

        // 덩치가 커졌으므로 공을 드리블 상태로 전환하는 판정 획득 범위 조정
        if (!this.player.hasBall && distance < 2.3 && this.ball.position.y < 2.5) {
          this.player.hasBall = true;
        }

        if (this.player.hasBall) {
          if (this.player.inputMap[" "]) {
            this.isChargingShoot = true;
            document.getElementById("power-bar-container").style.display = "block";
            
            if (this.shootPowerCurrent < this.shootPowerMax) {
              this.shootPowerCurrent += 0.09;
              const percent = ((this.shootPowerCurrent - 0.8) / (this.shootPowerMax - 0.8)) * 100;
              document.getElementById("power-bar").style.width = percent + "%";
            }
          } else if (this.isChargingShoot && !this.player.inputMap[" "]) {
            this.player.hasBall = false;
            this.isChargingShoot = false;

            const shootDirection = this.player.moveDirection.normalize();
            this.ballVelocity.x = shootDirection.x * this.shootPowerCurrent;
            this.ballVelocity.z = shootDirection.z * this.shootPowerCurrent;
            this.ballVelocity.y = this.shootPowerCurrent * 0.45; 

            this.shootPowerCurrent = 0.8;
            document.getElementById("power-bar-container").style.display = "none";
            document.getElementById("power-bar").style.width = "0%";
          }
        }
      }

      start() {
        this.engine.runRenderLoop(() => {
          this.player.update(this.fieldWidth, this.fieldHeight);
          this.checkCollisionsAndActions();
          
          this.handleHardPhysicsCollisions();
          this.processBallPhysics();
          
          this.updateCameraFollow();
          this.scene.render();
        });
        window.addEventListener('resize', () => {
          this.engine.resize();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('renderCanvas');
      const game = new Game(canvas);
      game.start();
    });
  </script>
</body>
</html>
