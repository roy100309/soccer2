<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Advanced Soccer Game - Physics Upgraded V2</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Malgun Gothic', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 10px;
      pointer-events: none;
      line-height: 1.6;
      z-index: 10;
    }
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 30px;
      border-radius: 30px;
      border: 2px solid #555;
      pointer-events: none;
      z-index: 10;
    }
    .score-team { display: inline-block; width: 80px; text-align: center; }
    #home-name { color: #ff3d00; } 
    #away-name { color: #2979ff; } 
    #score-text { font-size: 28px; color: #ffeb3b; margin: 0 10px; }

    #power-bar-container {
      margin-top: 10px;
      width: 200px;
      height: 15px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
    }
    #goal-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      font-family: 'Arial Black', sans-serif;
      font-size: 72px;
      font-weight: bold;
      text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000;
      display: none;
      pointer-events: none;
      z-index: 20;
      animation: pop 0.4s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.05); }
    }
    .highlight { color: #ffeb3b; font-weight: bold; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

  <div id="ui-container">
    🎮 <b>새로운 업데이트 내역</b><br>
    • 이동: <span class="highlight">화살표 키 (↑, ↓, ←, →)</span><br>
    • 대시: <span class="highlight">E 키</span> (부드러운 가속 및 감속 적용)<br>
    • 슛: 스페이스바 <span class="highlight">길게 누르기</span> (낮고 빠르게 깔려 나가는 탄도 구현)<br>
    • 버그 수정: 골대 안으로 들어간 공만 <span class="highlight">정확히 골 판정</span>
    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>
  </div>
  
  <div id="scoreboard">
    <span class="score-team" id="home-name">HOME</span>
    <span id="score-text"><span id="score-home">0</span> : <span id="score-away">0</span></span>
    <span class="score-team" id="away-name">AWAY</span>
  </div>
  
  <div id="goal-overlay">GOAL!!!</div>
  
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    const { Engine, Scene, FreeCamera, Vector3, HemisphericLight, MeshBuilder, StandardMaterial, Color3, DynamicTexture } = BABYLON;

    // ==========================================
    // 1. Player 클래스 (자연스러운 가속도 구현)
    // ==========================================
    class Player {
      constructor(scene) {
        this.scene = scene;
        this.minSpeed = 0.11;     // 평상시 속도
        this.maxSpeed = 0.26;     // 최대 대시 속도
        this.currentSpeed = 0.11; // 현재 연산되는 실시간 속도
        this.acceleration = 0.008; // 가속도 민감도
        
        this.inputMap = {};
        this.hasBall = false;
        this.moveDirection = new Vector3(0, 0, 1); 
        
        this.createDetailedHumanoid();
        this.setupInput();
      }

      createDetailedHumanoid() {
        this.mesh = MeshBuilder.CreateBox("playerRoot", { size: 0.1 }, this.scene);
        this.mesh.isVisible = false;

        const skinMat = new StandardMaterial("skinMat", this.scene);
        skinMat.diffuseColor = new Color3(0.95, 0.75, 0.65); 
        const jerseyMat = new StandardMaterial("jerseyMat", this.scene);
        jerseyMat.diffuseColor = new Color3(0.9, 0.1, 0.1); 
        const pantsMat = new StandardMaterial("pantsMat", this.scene);
        pantsMat.diffuseColor = new Color3(1, 1, 1); 
        const socksMat = new StandardMaterial("socksMat", this.scene);
        socksMat.diffuseColor = new Color3(0.1, 0.1, 0.1); 

        // 몸통 & 등번호
        this.torso = MeshBuilder.CreateBox("torso", { width: 0.8, height: 1.1, depth: 0.45 }, this.scene);
        this.torso.position.y = 1.35; this.torso.material = jerseyMat; this.torso.parent = this.mesh;

        const numberPlate = MeshBuilder.CreatePlane("numPlate", { width: 0.5, height: 0.6 }, this.scene);
        numberPlate.position.set(0, 1.35, -0.23); numberPlate.rotation.y = Math.PI; 
        const tex = new DynamicTexture("dynamicTex", {width:256, height:256}, this.scene);
        tex.hasAlpha = true; const ctx = tex.getContext();
        ctx.fillStyle = "transparent"; ctx.font = "bold 160px Arial"; ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("10", 128, 128); tex.update();
        const numMat = new StandardMaterial("numMat", this.scene);
        numMat.diffuseTexture = tex; numberPlate.material = numMat; numberPlate.parent = this.mesh;

        // 하의, 머리, 사지
        this.pants = MeshBuilder.CreateBox("pants", { width: 0.82, height: 0.4, depth: 0.47 }, this.scene);
        this.pants.position.y = 0.8; this.pants.material = pantsMat; this.pants.parent = this.mesh;
        this.head = MeshBuilder.CreateSphere("head", { diameter: 0.52 }, this.scene);
        this.head.position.y = 2.15; this.head.material = skinMat; this.head.parent = this.mesh;
        this.leftLeg = MeshBuilder.CreateCylinder("leftLeg", { height: 0.7, diameter: 0.22 }, this.scene);
        this.leftLeg.position.set(-0.24, 0.35, 0); this.leftLeg.material = socksMat; this.leftLeg.parent = this.mesh;
        this.rightLeg = this.leftLeg.clone("rightLeg"); this.rightLeg.position.x = 0.24; this.rightLeg.parent = this.mesh;
        this.leftArm = MeshBuilder.CreateCylinder("leftArm", { height: 0.8, diameter: 0.18 }, this.scene);
        this.leftArm.position.set(-0.52, 1.35, 0); this.leftArm.material = skinMat; this.leftArm.parent = this.mesh;
        this.rightArm = this.leftArm.clone("rightArm"); this.rightArm.position.x = 0.52; this.rightArm.parent = this.mesh;

        this.resetPosition();
      }

      resetPosition() {
        this.mesh.position.set(-20, 0, 0); 
        this.moveDirection.set(0, 0, 1); 
        this.mesh.rotation.y = Math.PI / 2;
        this.currentSpeed = this.minSpeed;
      }

      setupInput() {
        this.scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN:
              this.inputMap[kbInfo.event.key.toLowerCase()] = true;
              break;
            case BABYLON.KeyboardEventTypes.KEYUP:
              this.inputMap[kbInfo.event.key.toLowerCase()] = false;
              break;
          }
        });
      }

      update() {
        let moveX = 0;
        let moveZ = 0;

        if (this.inputMap["arrowup"])    moveX -= 1;
        if (this.inputMap["arrowdown"])  moveX += 1;
        if (this.inputMap["arrowleft"])  moveZ -= 1;
        if (this.inputMap["arrowright"]) moveZ += 1;

        // [수정] 자연스러운 가속도/감속도 보간 물리 연산
        if (this.inputMap["e"] && (moveX !== 0 || moveZ !== 0)) {
          // E를 누르고 움직이는 중이면 부드럽게 가속
          this.currentSpeed = Math.min(this.maxSpeed, this.currentSpeed + this.acceleration);
        } else {
          // E를 떼거나 멈추면 부드럽게 감속
          this.currentSpeed = Math.max(this.minSpeed, this.currentSpeed - this.acceleration * 1.5);
        }

        if (moveX !== 0 || moveZ !== 0) {
          const inputDir = new Vector3(moveX, 0, moveZ).normalize();
          this.mesh.position.addInPlace(inputDir.scale(this.currentSpeed));
          this.moveDirection.copyFrom(inputDir);

          const angle = Math.atan2(inputDir.x, inputDir.z);
          this.mesh.rotation.y = angle;

          // 달리기 속도 수치에 동기화되는 다리 모션 속도
          const animeSpeed = this.currentSpeed * 0.12;
          const time = performance.now() * animeSpeed;
          this.leftLeg.rotation.x = Math.sin(time) * 0.5;
          this.rightLeg.rotation.x = -Math.sin(time) * 0.5;
          this.leftArm.rotation.x = -Math.sin(time) * 0.3;
          this.rightArm.rotation.x = Math.sin(time) * 0.3;
        } else {
          this.leftLeg.rotation.x = 0; this.rightLeg.rotation.x = 0;
          this.leftArm.rotation.x = 0; this.rightArm.rotation.x = 0;
        }

        // 대형 경기장 외곽 하드가드 제한 (80x120 규격에 맞춤)
        this.mesh.position.x = Math.max(-39.5, Math.min(39.5, this.mesh.position.x));
        this.mesh.position.z = Math.max(-59.5, Math.min(59.5, this.mesh.position.z));
      }
    }

    // ==========================================
    // 2. Game 클래스 (경기장 확장 및 정밀 골 감지)
    // ==========================================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.engine = new Engine(this.canvas, true);
        this.scene = new Scene(this.engine);
        
        // [수정] 경기장 크기 대폭 추가 확장 (가로 80, 세로 120)
        this.fieldWidth = 80;
        this.fieldHeight = 120;
        
        this.ballVelocity = new Vector3(0, 0, 0);
        this.friction = 0.975; // 공 구름성 개선
        this.gravity = 0.045;  // 중력 효과 고정
        this.isResetting = false;

        this.scoreHome = 0; 
        this.scoreAway = 0; 

        this.shootPowerMax = 2.6; 
        this.shootPowerCurrent = 0.6;
        this.isChargingShoot = false;

        this.initScene();
        this.createProceduralGrassField();
        this.createRealGoals();
        this.createBall();
        this.player = new Player(this.scene);
      }

      initScene() {
        // 넓어진 경기장에 맞춰 카메라 시점 거리 및 높이 멀리 조절
        this.camera = new FreeCamera("sideCamera", new Vector3(75, 32, 0), this.scene);
        this.camera.setTarget(new Vector3(0, -6, 0)); 
        this.light = new HemisphericLight("light", new Vector3(0, 1, 0), this.scene);
        this.light.intensity = 1.0;
      }

      createProceduralGrassField() {
        const grassTexture = new DynamicTexture("grassTex", {width: 1024, height: 2048}, this.scene);
        const ctx = grassTexture.getContext();
        const stripes = 20; // 넓어진 경기장에 맞춤 잔디선 패턴
        const stripeHeight = 2048 / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = (i % 2 === 0) ? "#2b722d" : "#338537"; 
          ctx.fillRect(0, i * stripeHeight, 1024, stripeHeight);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 18; ctx.strokeRect(30, 30, 1024 - 60, 2048 - 60);
        ctx.beginPath(); ctx.arc(512, 1024, 180, 0, 2 * Math.PI); ctx.stroke();
        grassTexture.update();

        const field = MeshBuilder.CreateGround("soccerField", { width: this.fieldWidth, height: this.fieldHeight }, this.scene);
        const fieldMat = new StandardMaterial("fieldMat", this.scene);
        fieldMat.diffuseTexture = grassTexture;
        fieldMat.specularColor = new Color3(0, 0, 0); 
        field.material = fieldMat;
      }

      createRealGoals() {
        this.goalW = 16; this.goalH = 5.5; this.goalD = 4.5;
        // 확장된 구장 규격 Z = +-60 위치에 정렬
        this.createNetStructure(0, 60, this.goalW, this.goalH, this.goalD, true);  
        this.createNetStructure(0, -60, this.goalW, this.goalH, this.goalD, false); 
      }

      createNetStructure(x, z, w, h, d, isAwayGoal) {
        const whiteMat = new StandardMaterial("whiteMat", this.scene);
        whiteMat.diffuseColor = new Color3(0.95, 0.95, 0.95);
        const netMat = new StandardMaterial("netMat", this.scene);
        netMat.diffuseColor = new Color3(0.9, 0.9, 0.9); netMat.alpha = 0.18;
        const zDir = isAwayGoal ? 1 : -1;

        const leftPost = MeshBuilder.CreateCylinder("postL", { height: h, diameter: 0.28 }, this.scene); leftPost.position.set(x - w/2, h/2, z); leftPost.material = whiteMat;
        const rightPost = MeshBuilder.CreateCylinder("postR", { height: h, diameter: 0.28 }, this.scene); rightPost.position.set(x + w/2, h/2, z); rightPost.material = whiteMat;
        const topBar = MeshBuilder.CreateCylinder("barT", { height: w, diameter: 0.28 }, this.scene); topBar.position.set(x, h, z); topBar.rotation.z = Math.PI / 2; topBar.material = whiteMat;
        const backNet = MeshBuilder.CreateBox("backNet", { width: w, height: h, depth: 0.1 }, this.scene); backNet.position.set(x, h/2, z + (d * zDir)); backNet.material = netMat;
        const topNet = MeshBuilder.CreateBox("topNet", { width: w, height: 0.1, depth: d }, this.scene); topNet.position.set(x, h, z + (d/2 * zDir)); topNet.material = netMat;
        const sideNetL = MeshBuilder.CreateBox("sideNetL", { width: 0.1, height: h, depth: d }, this.scene); sideNetL.position.set(x - w/2, h/2, z + (d/2 * zDir)); sideNetL.material = netMat;
        const sideNetR = MeshBuilder.CreateBox("sideNetR", { width: 0.1, height: h, depth: d }, this.scene); sideNetR.position.set(x + w/2, h/2, z + (d/2 * zDir)); sideNetR.material = netMat;
      }

      createBall() {
        this.ballRadius = 0.55;
        this.ball = MeshBuilder.CreateSphere("soccerBall", { diameter: this.ballRadius * 2 }, this.scene);
        this.resetBall();

        const ballMat = new StandardMaterial("ballMat", this.scene);
        ballMat.diffuseColor = new Color3(1, 1, 1);
        this.ball.material = ballMat;
      }

      resetBall() {
        this.ball.position.set(0, this.ballRadius, 0);
        this.ballVelocity.set(0, 0, 0);
      }

      triggerGoal(isAwayGoal) {
        if (this.isResetting) return;
        this.isResetting = true;
        this.player.hasBall = false;

        if (isAwayGoal) { this.scoreHome++; document.getElementById("score-home").innerText = this.scoreHome; }
        else { this.scoreAway++; document.getElementById("score-away").innerText = this.scoreAway; }

        const overlay = document.getElementById("goal-overlay");
        overlay.style.display = "block";

        setTimeout(() => {
          this.resetBall();
          this.player.resetPosition();
          overlay.style.display = "none";
          this.isResetting = false;
        }, 2000);
      }

      processBallPhysics() {
        if (this.isResetting) return;

        if (this.player.hasBall) {
          const offset = this.player.moveDirection.scale(1.35);
          this.ball.position.x = this.player.mesh.position.x + offset.x;
          this.ball.position.z = this.player.mesh.position.z + offset.z;
          this.ball.position.y = this.ballRadius; 
          this.ballVelocity.set(0, 0, 0);
        } else {
          // 공 이동 물리 프레임 갱신
          this.ball.position.addInPlace(this.ballVelocity);
          
          if (this.ball.position.y > this.ballRadius) {
            this.ballVelocity.y -= this.gravity;
          } else {
            this.ball.position.y = this.ballRadius;
            this.ballVelocity.y = 0;
            this.ballVelocity.x *= this.friction;
            this.ballVelocity.z *= this.friction;
          }

          if (this.ballVelocity.length() < 0.001) this.ballVelocity.set(0, 0, 0);

          // [버그 수정 완료] 골대 안 통과 정밀 감지 연산 보정
          // 공의 Z좌표가 정확하게 최종 엔드라인 골대 내부 구역에 진입했는지를 체크
          const currentZ = this.ball.position.z;
          if (Math.abs(currentZ) >= 59.3) {
            // 핵심 교정: 골대 가로 규격(w/2) 내부에 위치하면서 높이가 골대 상단(goalH) 이하일 때만 골인 판정 트리거
            if (this.ball.position.x >= -this.goalW/2 && this.ball.position.x <= this.goalW/2) {
              if (this.ball.position.y <= this.goalH + 0.3) {
                const isAwayGoal = currentZ > 0;
                this.triggerGoal(isAwayGoal);
                return;
              }
            }
          }

          // 아웃 오브 바운즈 (터치 아웃 및 골대 외곽 라인아웃) 리포지션 연산
          const borderX = (this.fieldWidth / 2) - this.ballRadius;
          const borderZ = (this.fieldHeight / 2) - this.ballRadius;
          let isOut = false;

          if (Math.abs(this.ball.position.x) > borderX) {
            this.ball.position.x = Math.sign(this.ball.position.x) * (borderX - 1.2);
            isOut = true;
          }
          // 골대 구역 바깥의 벽에 부딪혔을 때만 아웃라인 보정 처리하여 골 안쪽 진입 유도
          if (Math.abs(this.ball.position.z) > borderZ) {
            if (this.ball.position.x < -this.goalW/2 || this.ball.position.x > this.goalW/2) {
              this.ball.position.z = Math.sign(this.ball.position.z) * (borderZ - 1.2);
              isOut = true;
            }
          }

          if (isOut) {
            this.ballVelocity.set(0, 0, 0);
            this.ball.position.y = this.ballRadius;
            const centerDirection = new Vector3(0, 0, 0).subtract(this.ball.position).normalize();
            this.player.mesh.position.copyFrom(this.ball.position.add(centerDirection.scale(1.8)));
            this.player.mesh.position.y = 0;
          }
        }
      }

      checkCollisionsAndActions() {
        if (this.isResetting) return;

        const playerPos = this.player.mesh.position;
        const ballPos = this.ball.position;
        const distance = Vector3.Distance(playerPos, ballPos);

        if (!this.player.hasBall && distance < 1.7 && this.ball.position.y < 1.8) {
          this.player.hasBall = true;
        }

        if (this.player.hasBall) {
          if (this.player.inputMap[" "]) {
            this.isChargingShoot = true;
            document.getElementById("power-bar-container").style.display = "block";
            
            if (this.shootPowerCurrent < this.shootPowerMax) {
              this.shootPowerCurrent += 0.06;
              const percent = ((this.shootPowerCurrent - 0.6) / (this.shootPowerMax - 0.6)) * 100;
              document.getElementById("power-bar").style.width = percent + "%";
            }
          } else if (this.isChargingShoot && !this.player.inputMap[" "]) {
            this.player.hasBall = false;
            this.isChargingShoot = false;

            // [수정] 직선 레이저 슈팅 탄도학 연산 구현
            // 전방 추진 속도 성분은 강화하고, 위로 뜨는 Y축 성분을 낮추어 깔려 나가는 탄도로 조정
            const shootDirection = this.player.moveDirection.normalize();
            
            this.ballVelocity.x = shootDirection.x * this.shootPowerCurrent;
            this.ballVelocity.z = shootDirection.z * this.shootPowerCurrent;
            
            // 기존 0.38 계수를 0.12로 대폭 낮춰 포물선이 아닌 낮고 빠른 무회전 슛 구현 (중력에 의해 떨어짐)
            this.ballVelocity.y = this.shootPowerCurrent * 0.12; 

            this.shootPowerCurrent = 0.6;
            document.getElementById("power-bar-container").style.display = "none";
            document.getElementById("power-bar").style.width = "0%";
          }
        }
      }

      start() {
        this.engine.runRenderLoop(() => {
          this.player.update();
          this.checkCollisionsAndActions();
          this.processBallPhysics();
          this.scene.render();
        });
        window.addEventListener('resize', () => {
          this.engine.resize();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('renderCanvas');
      const game = new Game(canvas);
      game.start();
    });
  </script>
</body>
</html>
