<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Soccer Game - Advanced</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 18px;
      border-radius: 8px;
      pointer-events: none;
      line-height: 1.5;
    }
    .highlight {
      color: #ffeb3b;
      font-weight: bold;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

  <div id="ui-info">
    🎮 <b>조작 방법</b><br>
    • 이동: <span class="highlight">W, A, S, D</span> 또는 <span class="highlight">방향키</span><br>
    • 슛: 공을 잡은 상태에서 <span class="highlight">Spacebar</span> (조준된 골대 방향)
  </div>
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    const { Engine, Scene, FreeCamera, Vector3, HemisphericLight, MeshBuilder, StandardMaterial, Color3 } = BABYLON;

    // ==========================================
    // 1. Player 클래스
    // ==========================================
    class Player {
      constructor(scene) {
        this.scene = scene;
        this.speed = 0.2;
        this.inputMap = {};
        this.hasBall = false; // 공 소유 여부
        
        this.createMesh();
        this.setupInput();
      }

      createMesh() {
        this.mesh = MeshBuilder.CreateCapsule("player", { height: 2, radius: 0.6 }, this.scene);
        this.mesh.position.set(0, 1, -10); // 하프라인 아래쪽 시작

        const material = new StandardMaterial("playerMat", this.scene);
        material.diffuseColor = new Color3(1, 0.1, 0.1); // 강렬한 빨간색
        this.mesh.material = material;
      }

      setupInput() {
        this.scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN:
              this.inputMap[kbInfo.event.key.toLowerCase()] = true;
              break;
            case BABYLON.KeyboardEventTypes.KEYUP:
              this.inputMap[kbInfo.event.key.toLowerCase()] = false;
              break;
          }
        });
      }

      update() {
        // 이동 로직
        if (this.inputMap["w"] || this.inputMap["arrowup"]) this.mesh.position.z += this.speed;
        if (this.inputMap["s"] || this.inputMap["arrowdown"]) this.mesh.position.z -= this.speed;
        if (this.inputMap["a"] || this.inputMap["arrowleft"]) this.mesh.position.x -= this.speed;
        if (this.inputMap["d"] || this.inputMap["arrowright"]) this.mesh.position.x += this.speed;

        // 경기장 바깥으로 나가지 못하도록 제한 (가로 +-24, 세로 +-34)
        this.mesh.position.x = Math.max(-24, Math.min(24, this.mesh.position.x));
        this.mesh.position.z = Math.max(-34, Math.min(34, this.mesh.position.z));
      }
    }

    // ==========================================
    // 2. Game 클래스
    // ==========================================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.engine = new Engine(this.canvas, true);
        this.scene = new Scene(this.engine);
        
        // 경기장 규격 정의
        this.fieldWidth = 50;
        this.fieldHeight = 70;

        // 공의 물리 상태 변수
        this.ballVelocity = new Vector3(0, 0, 0);
        this.friction = 0.96; // 공이 자연스럽게 멈추도록 하는 마찰력

        this.initScene();
        this.createField();
        this.createGoals();
        this.createBall();
        this.player = new Player(this.scene);
      }

      initScene() {
        // 양쪽 골대(세로축 기준 끝과 끝)가 모두 보이도록 광각/높은 탑다운 뷰 설정
        this.camera = new FreeCamera("camera1", new Vector3(0, 42, -45), this.scene);
        this.camera.setTarget(new Vector3(0, -2, 0)); // 경기장 중심을 바라봄
        
        this.light = new HemisphericLight("light", new Vector3(0, 1, 0), this.scene);
        this.light.intensity = 0.9;
      }

      createField() {
        // 넓어진 축구 경기장 바닥 (50x70)
        const field = MeshBuilder.CreateGround("soccerField", { width: this.fieldWidth, height: this.fieldHeight }, this.scene);
        const fieldMat = new StandardMaterial("fieldMat", this.scene);
        fieldMat.diffuseColor = new Color3(0.15, 0.55, 0.22);
        field.material = fieldMat;
      }

      createGoals() {
        // 골대 크기 정의
        const goalW = 10, goalH = 4, goalD = 3;

        // 위쪽 골대 (Z축 양수 끝)
        this.createGoalStructure(0, 35, goalW, goalH, goalD, new Color3(0.9, 0.9, 0.9));
        // 아래쪽 골대 (Z축 음수 끝)
        this.createGoalStructure(0, -35, goalW, goalH, goalD, new Color3(0.9, 0.9, 0.9));
      }

      createGoalStructure(x, z, w, h, d) {
        // 간단한 박스 형태로 시각적 골대 구현
        const topBar = MeshBuilder.CreateBox("goalTop", { width: w, height: 0.2, depth: d }, this.scene);
        topBar.position.set(x, h, z);

        const leftPost = MeshBuilder.CreateBox("goalLeft", { width: 0.2, height: h, depth: d }, this.scene);
        leftPost.position.set(x - w/2, h/2, z);

        const rightPost = MeshBuilder.CreateBox("goalRight", { width: 0.2, height: h, depth: d }, this.scene);
        rightPost.position.set(x + w/2, h/2, z);
      }

      createBall() {
        this.ballRadius = 0.5;
        this.ball = MeshBuilder.CreateSphere("soccerBall", { diameter: this.ballRadius * 2 }, this.scene);
        
        // 공이 바닥(Y=0) 뚫지 않게 초기 반지름 높이 설정
        this.ball.position.set(0, this.ballRadius, 0);

        const ballMat = new StandardMaterial("ballMat", this.scene);
        ballMat.diffuseColor = new Color3(1, 1, 1);
        this.ball.material = ballMat;
      }

      processBallPhysics() {
        if (this.player.hasBall) {
          // [드리블 상태] 공이 선수의 발 앞(약간 앞쪽 Z축)에 딱 붙어 이동함
          // 이동 방향을 자연스럽게 예측하기 위해 플레이어 위치 기준으로 살짝 변형 가능
          this.ball.position.x = this.player.mesh.position.x;
          this.ball.position.z = this.player.mesh.position.z + 1.2; 
          this.ball.position.y = this.ballRadius; // 항상 바닥 고정 보장
          this.ballVelocity.set(0, 0, 0); // 잡고있을 땐 속도 초기화
        } else {
          // [자유 공 상태] 슛을 쏘거나 튕겨 나갔을 때의 관성 및 마찰력 적용
          this.ball.position.addInPlace(this.ballVelocity);
          this.ballVelocity.scaleInPlace(this.friction); // 마찰력으로 점점 느려짐

          // 속도가 극히 낮아지면 완전히 멈춤
          if (this.ballVelocity.length() < 0.001) {
            this.ballVelocity.set(0, 0, 0);
          }

          // 경기장 벽 충돌 및 튕기기 제어
          const borderX = (this.fieldWidth / 2) - this.ballRadius;
          const borderZ = (this.fieldHeight / 2) - this.ballRadius;

          if (Math.abs(this.ball.position.x) > borderX) {
            this.ball.position.x = Math.sign(this.ball.position.x) * borderX;
            this.ballVelocity.x *= -0.6; // 튕김 계수 적용
          }
          if (Math.abs(this.ball.position.z) > borderZ) {
            // 골대 구역(가로 -5 ~ 5 사이)이면 골인 상황이므로 튕기지 않고 통과하게 할 수 있으나 기본 벽처리 적용
            this.ball.position.z = Math.sign(this.ball.position.z) * borderZ;
            this.ballVelocity.z *= -0.6;
          }

          // **공이 바닥을 절대로 뚫지 않도록 강제 검증**
          if (this.ball.position.y !== this.ballRadius) {
            this.ball.position.y = this.ballRadius;
          }
        }
      }

      checkCollisionsAndActions() {
        const playerPos = this.player.mesh.position;
        const ballPos = this.ball.position;
        const distance = Vector3.Distance(playerPos, ballPos);

        // 1. 드리블 판정 (공 소유)
        // 선수가 공과 아주 가까워지면(자유 상태일 때만) 자동으로 공을 획득함
        if (!this.player.hasBall && distance < 1.4) {
          this.player.hasBall = true;
        }

        // 2. 슛 메커니즘 (스페이스바 입력)
        if (this.player.hasBall && this.player.inputMap[" "]) {
          this.player.hasBall = false; // 공을 소유 해제

          // 조준점: 위쪽 공격 골대(0, 0, 35)를 향해 레이저 슛 수행
          const targetGoal = new Vector3(0, this.ballRadius, 35);
          const shootDirection = targetGoal.subtract(this.ball.position).normalize();
          
          // 슛 파워 세기 설정
          const shootPower = 1.2;
          this.ballVelocity = shootDirection.scale(shootPower);
          
          // 연속 입력 방지를 위한 스페이스바 상태 초기화
          this.player.inputMap[" "] = false; 
        }
      }

      start() {
        this.engine.runRenderLoop(() => {
          this.player.update();
          this.checkCollisionsAndActions();
          this.processBallPhysics();
          this.scene.render();
        });

        window.addEventListener('resize', () => {
          this.engine.resize();
        });
      }
    }

    // 게임 기동
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('renderCanvas');
      const game = new Game(canvas);
      game.start();
    });
  </script>
</body>
</html>
