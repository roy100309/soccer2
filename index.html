<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Advanced Soccer Game - Score & Fixed Controls</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* 가이드 UI */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Malgun Gothic', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 10px;
      pointer-events: none;
      line-height: 1.6;
      z-index: 10;
    }
    /* 스코어보드 UI */
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 30px;
      border-radius: 30px;
      border: 2px solid #555;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
    }
    .score-team { display: inline-block; width: 80px; text-align: center; }
    #home-name { color: #ff5252; } /* 우리팀: 빨강 */
    #away-name { color: #448aff; } /* 상대팀: 파랑 */
    #score-text { font-size: 28px; color: #ffeb3b; margin: 0 10px; }

    /* 슛 파워 게이지 바 */
    #power-bar-container {
      margin-top: 10px;
      width: 200px;
      height: 15px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
    }
    /* 골 세레머니 효과 */
    #goal-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      font-family: 'Arial Black', sans-serif;
      font-size: 72px;
      font-weight: bold;
      text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000;
      display: none;
      pointer-events: none;
      z-index: 20;
      animation: pop 0.4s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.05); }
    }
    .highlight { color: #ffeb3b; font-weight: bold; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

  <div id="ui-container">
    🎮 <b>조작 방법 안내</b><br>
    • 이동: <span class="highlight">화살표 키 (↑, ↓, ←, →)</span><br>
    &nbsp;&nbsp; (화면 시점 기준 직관적인 상하좌우 이동)<br>
    • 슛: 공을 잡고 스페이스바 <span class="highlight">길게 누르기</span>
    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>
  </div>
  
  <div id="scoreboard">
    <span class="score-team" id="home-name">HOME</span>
    <span id="score-text"><span id="score-home">0</span> : <span id="score-away">0</span></span>
    <span class="score-team" id="away-name">AWAY</span>
  </div>
  
  <div id="goal-overlay">GOAL!!!</div>
  
  <canvas id="renderCanvas"></canvas>

  <script type="module">
    const { Engine, Scene, FreeCamera, Vector3, HemisphericLight, MeshBuilder, StandardMaterial, Color3 } = BABYLON;

    // ==========================================
    // 1. Player 클래스 (화살표 키 조작 동기화)
    // ==========================================
    class Player {
      constructor(scene) {
        this.scene = scene;
        this.speed = 0.22;
        this.inputMap = {};
        this.hasBall = false;
        this.moveDirection = new Vector3(1, 0, 0); // 기본 오른쪽 바라봄
        
        this.createHumanoidMesh();
        this.setupInput();
      }

      createHumanoidMesh() {
        this.mesh = MeshBuilder.CreateBox("playerRoot", { size: 0.1 }, this.scene);
        this.mesh.isVisible = false;

        const skinMat = new StandardMaterial("skinMat", this.scene);
        skinMat.diffuseColor = new Color3(0.9, 0.7, 0.6); 
        const uniformMat = new StandardMaterial("uniformMat", this.scene);
        uniformMat.diffuseColor = new Color3(1, 0.1, 0.1); // 우리팀: 빨간색 유니폼

        // 몸통
        this.torso = MeshBuilder.CreateBox("torso", { width: 0.8, height: 1.2, depth: 0.4 }, this.scene);
        this.torso.position.y = 1.3;
        this.torso.material = uniformMat;
        this.torso.parent = this.mesh;

        // 머리
        this.head = MeshBuilder.CreateSphere("head", { diameter: 0.5 }, this.scene);
        this.head.position.y = 2.1;
        this.head.material = skinMat;
        this.head.parent = this.mesh;

        // 다리
        this.leftLeg = MeshBuilder.CreateCylinder("leftLeg", { height: 0.8, diameter: 0.22 }, this.scene);
        this.leftLeg.position.set(-0.25, 0.4, 0);
        this.leftLeg.material = skinMat;
        this.leftLeg.parent = this.mesh;

        this.rightLeg = this.leftLeg.clone("rightLeg");
        this.rightLeg.position.x = 0.25;
        this.rightLeg.parent = this.mesh;

        // 팔
        this.leftArm = MeshBuilder.CreateCylinder("leftArm", { height: 0.8, diameter: 0.18 }, this.scene);
        this.leftArm.position.set(-0.5, 1.3, 0);
        this.leftArm.material = skinMat;
        this.leftArm.parent = this.mesh;

        this.rightArm = this.leftArm.clone("rightArm");
        this.rightArm.position.x = 0.5;
        this.rightArm.parent = this.mesh;

        this.resetPosition();
      }

      resetPosition() {
        // 하프라인 살짝 왼쪽(우리 진영)에서 시작
        this.mesh.position.set(-15, 0, 0);
        this.moveDirection.set(1, 0, 0); // 시작할 때 오른쪽(상대골대) 조준
        this.mesh.rotation.y = Math.PI / 2;
      }

      setupInput() {
        this.scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN:
              this.inputMap[kbInfo.event.key] = true;
              break;
            case BABYLON.KeyboardEventTypes.KEYUP:
              this.inputMap[kbInfo.event.key] = false;
              break;
          }
        });
      }

      update() {
        let fieldX = 0; // 경기장의 X축 (세로선 방향)
        let fieldZ = 0; // 경기장의 Z축 (가로선/골대 방향)

        // [수정] 오직 화살표 키로만 조작하며 화면 시점 기준으로 완벽 매핑
        // 카메라가 측면(+X)에서 경기장 중심(-X)을 바라보는 상태이므로:
        // ↑ 화살표 = 화면 위쪽으로 전진 = 경기장 내부의 +X축 방향
        // ↓ 화살표 = 화면 아래쪽으로 후진 = 경기장 내부의 -X축 방향
        // ← 화살표 = 화면 왼쪽(우리 골대) = 경기장 내부의 -Z축 방향
        // → 화살표 = 화면 오른쪽(상대 골대) = 경기장 내부의 +Z축 방향
        if (this.inputMap["ArrowUp"])    fieldX += 1;
        if (this.inputMap["ArrowDown"])  fieldX -= 1;
        if (this.inputMap["ArrowLeft"])  fieldZ -= 1;
        if (this.inputMap["ArrowRight"]) fieldZ += 1;

        if (fieldX !== 0 || fieldZ !== 0) {
          const inputDir = new Vector3(fieldX, 0, fieldZ).normalize();
          this.mesh.position.addInPlace(inputDir.scale(this.speed));
          this.moveDirection.copyFrom(inputDir);

          // 캐릭터가 진행 방향을 바라보도록 각도 회전 (조작 시선 일치)
          const angle = Math.atan2(inputDir.x, inputDir.z);
          this.mesh.rotation.y = angle;

          // 달리기 다리 모션 애니메이션
          const time = performance.now() * 0.015;
          this.leftLeg.rotation.x = Math.sin(time) * 0.4;
          this.rightLeg.rotation.x = -Math.sin(time) * 0.4;
        } else {
          this.leftLeg.rotation.x = 0;
          this.rightLeg.rotation.x = 0;
        }

        // 경기장 이탈 제한 락 (가로 70 -> +-34, 세로 100 -> +-49)
        this.mesh.position.x = Math.max(-34, Math.min(34, this.mesh.position.x));
        this.mesh.position.z = Math.max(-49, Math.min(49, this.mesh.position.z));
      }
    }

    // ==========================================
    // 2. Game 클래스 (스코어보드 연동)
    // ==========================================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.engine = new Engine(this.canvas, true);
        this.scene = new Scene(this.engine);
        
        this.fieldWidth = 70;
        this.fieldHeight = 100;
        this.ballVelocity = new Vector3(0, 0, 0);
        this.friction = 0.97;
        this.isResetting = false;

        // 스코어 상태 변수
        this.scoreHome = 0; // 우리팀
        this.scoreAway = 0; // 상대팀

        // 슛 충전 데이터
        this.shootPowerMax = 1.8;
        this.shootPowerCurrent = 0.3;
        this.isChargingShoot = false;

        this.initScene();
        this.createField();
        this.createRealGoals();
        this.createBall();
        this.player = new Player(this.scene);
      }

      initScene() {
        // 오른쪽 터치라인 사이드 중계방송 시점 카메라 배치
        this.camera = new FreeCamera("sideCamera", new Vector3(65, 26, 0), this.scene);
        this.camera.setTarget(new Vector3(0, -5, 0)); 
        
        this.light = new HemisphericLight("light", new Vector3(0, 1, 0), this.scene);
        this.light.intensity = 0.95;
      }

      createField() {
        const field = MeshBuilder.CreateGround("soccerField", { width: this.fieldWidth, height: this.fieldHeight }, this.scene);
        const fieldMat = new StandardMaterial("fieldMat", this.scene);
        fieldMat.diffuseColor = new Color3(0.12, 0.52, 0.18);
        field.material = fieldMat;
      }

      createRealGoals() {
        this.goalW = 14; this.goalH = 5; this.goalD = 4;
        
        // 상대팀 골대 (오른쪽 화면 끝 = Z축 +50)
        this.createNetStructure(0, 50, this.goalW, this.goalH, this.goalD, true);
        // 우리팀 골대 (왼쪽 화면 끝 = Z축 -50)
        this.createNetStructure(0, -50, this.goalW, this.goalH, this.goalD, false);
      }

      createNetStructure(x, z, w, h, d, isAwayGoal) {
        const whiteMat = new StandardMaterial("whiteMat", this.scene);
        whiteMat.diffuseColor = new Color3(0.95, 0.95, 0.95);

        const netMat = new StandardMaterial("netMat", this.scene);
        netMat.diffuseColor = new Color3(0.8, 0.8, 0.8);
        netMat.alpha = 0.25;

        const zDir = isAwayGoal ? 1 : -1;

        // 하얀 골대 기둥 파이프
        const leftPost = MeshBuilder.CreateCylinder("postL", { height: h, diameter: 0.25 }, this.scene);
        leftPost.position.set(x - w/2, h/2, z); leftPost.material = whiteMat;
        const rightPost = MeshBuilder.CreateCylinder("postR", { height: h, diameter: 0.25 }, this.scene);
        rightPost.position.set(x + w/2, h/2, z); rightPost.material = whiteMat;
        const topBar = MeshBuilder.CreateCylinder("barT", { height: w, diameter: 0.25 }, this.scene);
        topBar.position.set(x, h, z); topBar.rotation.z = Math.PI / 2; topBar.material = whiteMat;

        // 반투명 입체 그물망 망 구조
        const backNet = MeshBuilder.CreateBox("backNet", { width: w, height: h, depth: 0.1 }, this.scene);
        backNet.position.set(x, h/2, z + (d * zDir)); backNet.material = netMat;
        const topNet = MeshBuilder.CreateBox("topNet", { width: w, height: 0.1, depth: d }, this.scene);
        topNet.position.set(x, h, z + (d/2 * zDir)); topNet.material = netMat;
        const sideNetL = MeshBuilder.CreateBox("sideNetL", { width: 0.1, height: h, depth: d }, this.scene);
        sideNetL.position.set(x - w/2, h/2, z + (d/2 * zDir)); sideNetL.material = netMat;
        const sideNetR = MeshBuilder.CreateBox("sideNetR", { width: 0.1, height: h, depth: d }, this.scene);
        sideNetR.position.set(x + w/2, h/2, z + (d/2 * zDir)); sideNetR.material = netMat;
      }

      createBall() {
        this.ballRadius = 0.55;
        this.ball = MeshBuilder.CreateSphere("soccerBall", { diameter: this.ballRadius * 2 }, this.scene);
        this.resetBall();

        const ballMat = new StandardMaterial("ballMat", this.scene);
        ballMat.diffuseColor = new Color3(1, 1, 1);
        this.ball.material = ballMat;
      }

      resetBall() {
        this.ball.position.set(0, this.ballRadius, 0);
        this.ballVelocity.set(0, 0, 0);
      }

      // [수정] 스코어 판정 연산 함수
      triggerGoal(isAwayGoal) {
        if (this.isResetting) return;
        this.isResetting = true;
        this.player.hasBall = false;

        if (isAwayGoal) {
          // 오른쪽(상대골대)에 넣으면 우리팀 점수 추가
          this.scoreHome++;
          document.getElementById("score-home").innerText = this.scoreHome;
        } else {
          // 왼쪽(우리팀 골대)에 넣으면 자책골 -> 상대팀 점수 추가
          this.scoreAway++;
          document.getElementById("score-away").innerText = this.scoreAway;
        }

        // GOAL 알림창 띄우기
        const overlay = document.getElementById("goal-overlay");
        overlay.style.display = "block";

        // 2초 뒤 상태 리셋 및 센터서클 플레이 재개
        setTimeout(() => {
          this.resetBall();
          this.player.resetPosition();
          overlay.style.display = "none";
          this.isResetting = false;
        }, 2000);
      }

      processBallPhysics() {
        if (this.isResetting) return;

        if (this.player.hasBall) {
          // 캐릭터의 회전 방향 앞쪽에 공이 자석처럼 단단히 고정 밀착
          const offset = this.player.moveDirection.scale(1.3);
          this.ball.position.x = this.player.mesh.position.x + offset.x;
          this.ball.position.z = this.player.mesh.position.z + offset.z;
          this.ball.position.y = this.ballRadius; 
          this.ballVelocity.set(0, 0, 0);
        } else {
          this.ball.position.addInPlace(this.ballVelocity);
          this.ballVelocity.scaleInPlace(this.friction);

          if (this.ballVelocity.length() < 0.001) this.ballVelocity.set(0, 0, 0);

          // [버그 수정 완료] 골대 프레임 범위 정밀 감지 시스템
          // 경기장 세로 한계선인 Z = +-49.3을 넘어섰을 때 골대 가로 규격(골 가로 폭 14 -> +-7) 안쪽인지 검증
          if (Math.abs(this.ball.position.z) >= 49.3) {
            if (this.ball.position.x >= -this.goalW/2 && this.ball.position.x <= this.goalW/2) {
              const isAwayGoal = this.ball.position.z > 0; // Z가 양수면 상대팀 골대
              this.triggerGoal(isAwayGoal);
              return;
            }
          }

          // 경기장 바깥 라인 충돌 바운딩박스 연산
          const borderX = (this.fieldWidth / 2) - this.ballRadius;
          const borderZ = (this.fieldHeight / 2) - this.ballRadius;

          if (Math.abs(this.ball.position.x) > borderX) {
            this.ball.position.x = Math.sign(this.ball.position.x) * borderX;
            this.ballVelocity.x *= -0.5;
          }
          if (Math.abs(this.ball.position.z) > borderZ) {
            // 골대 구역 밖에서 사이드라인 벽에 부딪힐 때만 튕기도록 처리
            if (this.ball.position.x < -this.goalW/2 || this.ball.position.x > this.goalW/2) {
              this.ball.position.z = Math.sign(this.ball.position.z) * borderZ;
              this.ballVelocity.z *= -0.5;
            }
          }

          // 공이 땅밑을 뚫지 않도록 절댓값 고정 가드
          if (this.ball.position.y !== this.ballRadius) this.ball.position.y = this.ballRadius;
        }
      }

      checkCollisionsAndActions() {
        if (this.isResetting) return;

        const playerPos = this.player.mesh.position;
        const ballPos = this.ball.position;
        const distance = Vector3.Distance(playerPos, ballPos);

        // 공 드리블 소유 판정
        if (!this.player.hasBall && distance < 1.6) {
          this.player.hasBall = true;
        }

        // 스페이스바 차징 에너지 바 슛 연산
        if (this.player.hasBall) {
          if (this.player.inputMap[" "]) {
            this.isChargingShoot = true;
            document.getElementById("power-bar-container").style.display = "block";
            
            if (this.shootPowerCurrent < this.shootPowerMax) {
              this.shootPowerCurrent += 0.05;
              const percent = ((this.shootPowerCurrent - 0.3) / (this.shootPowerMax - 0.3)) * 100;
              document.getElementById("power-bar").style.width = percent + "%";
            }
          } else if (this.isChargingShoot && !this.player.inputMap[" "]) {
            this.player.hasBall = false;
            this.isChargingShoot = false;

            const shootDirection = this.player.moveDirection.normalize();
            this.ballVelocity = shootDirection.scale(this.shootPowerCurrent);

            this.shootPowerCurrent = 0.3;
            document.getElementById("power-bar-container").style.display = "none";
            document.getElementById("power-bar").style.width = "0%";
          }
        }
      }

      start() {
        this.engine.runRenderLoop(() => {
          this.player.update();
          this.checkCollisionsAndActions();
          this.processBallPhysics();
          this.scene.render();
        });

        window.addEventListener('resize', () => {
          this.engine.resize();
        });
      }
    }

    // 초기 구동 브릿지
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('renderCanvas');
      const game = new Game(canvas);
      game.start();
    });
  </script>
</body>
</html>
